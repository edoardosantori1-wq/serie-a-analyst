name: Aggiorna Serie A Analyst

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      uscita:
        description: "si = forza l'uscita del report; quote = riprova subito le quote"
        default: "no"

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: aggiorna
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scarica dati, calcola, genera il sito
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          STRIKER_KEY: ${{ secrets.STRIKER_KEY }}
          FOOTBALLDATA_KEY: ${{ secrets.FOOTBALLDATA_KEY }}
        run: |
          if [ "${{ github.event.inputs.uscita }}" = "si" ]; then python orchestra.py --uscita; elif [ "${{ github.event.inputs.uscita }}" = "quote" ]; then python orchestra.py --quote; else python orchestra.py; fi
      - name: Promemoria uscita report (arriva per email)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f dati/notifica.txt ]; then
            gh issue create --title "Report pronto: $(head -1 dati/notifica.txt | cut -d: -f1)" --body-file dati/notifica.txt --assignee "${{ github.repository_owner }}" || true
            rm dati/notifica.txt
          fi
      - name: Salva i dati aggiornati nel progetto
        run: |
          git config user.name "serie-a-analyst-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A dati sito
          git diff --cached --quiet || git commit -m "Aggiornamento automatico $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: sito
      - name: Pubblica il sito
        id: pubblica
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Attendi e riprova la pubblicazione (se GitHub non ha risposto)
        if: steps.pubblica.outcome == 'failure'
        run: sleep 60
      - name: Pubblica il sito (secondo tentativo)
        if: steps.pubblica.outcome == 'failure'
        uses: actions/deploy-pages@v4
